name: Build AI Students Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      require_firebase_config:
        description: 'Fail build if GOOGLE_SERVICES_JSON_BASE64 secret is not configured'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 3. Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android SDK 36 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 5. Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 6. TypeScript check
        run: npx tsc --noEmit

      - name: 7. Build Vite project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ais-pre-sep3an4tmru2vymxhi6lyy-318163649696.asia-northeast1.run.app' }}
        run: npm run build

      - name: 8. Configure and validate Android google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          REQUIRE_FIREBASE_CONFIG: ${{ inputs.require_firebase_config || 'false' }}
        run: |
          set -euo pipefail
          TARGET_FILE="android/app/google-services.json"
          mkdir -p android/app

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > "$TARGET_FILE" 2>/dev/null; then
              rm -f "$TARGET_FILE"
              echo "::error::Failed to Base64-decode GOOGLE_SERVICES_JSON_BASE64. Re-encode google-services.json without line breaks and update the repository secret."
              exit 1
            fi
            echo "Decoded android/app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$TARGET_FILE"
            echo "Wrote android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -f "$TARGET_FILE" ]; then
            echo "Using existing android/app/google-services.json file."
          else
            if [ "$REQUIRE_FIREBASE_CONFIG" = "true" ]; then
              echo "::error::Missing required GitHub Actions secret GOOGLE_SERVICES_JSON_BASE64. Add it under Repository -> Settings -> Secrets and variables -> Actions -> New repository secret."
              exit 1
            fi
            echo "firebase_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub secret GOOGLE_SERVICES_JSON_BASE64 is not configured yet. Continuing Android APK build without google-services.json (native Android Google Sign-In and Phone OTP require adding GOOGLE_SERVICES_JSON_BASE64 in Repository -> Settings -> Secrets and variables -> Actions)."
            exit 0
          fi

          if [ ! -s "$TARGET_FILE" ]; then
            rm -f "$TARGET_FILE"
            echo "::error::Decoded android/app/google-services.json is empty."
            exit 1
          fi

          if ! python3 - <<'PY'
          import json
          import os
          import sys

          path = "android/app/google-services.json"
          if not os.path.isfile(path):
              print("::error::android/app/google-services.json was not created.")
              sys.exit(1)

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              print("::error::android/app/google-services.json is not valid JSON.")
              sys.exit(1)

          if not isinstance(data, dict):
              print("::error::android/app/google-services.json root must be a JSON object.")
              sys.exit(1)

          project_info = data.get("project_info")
          if not isinstance(project_info, dict) or not project_info.get("project_id") or not project_info.get("project_number"):
              print("::error::google-services.json is missing required project_info fields (project_id / project_number).")
              sys.exit(1)

          clients = data.get("client")
          if not isinstance(clients, list) or len(clients) == 0:
              print("::error::google-services.json does not contain any Firebase client entries.")
              sys.exit(1)

          target_pkg = "com.aistudents.app"
          matched_client = None
          for client in clients:
              if not isinstance(client, dict):
                  continue
              pkg = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if pkg == target_pkg:
                  matched_client = client
                  break

          if matched_client is None:
              print(f"::error::google-services.json does not match Android package name '{target_pkg}'.")
              sys.exit(1)

          app_id = matched_client.get("client_info", {}).get("mobilesdk_app_id")
          api_keys = matched_client.get("api_key")
          has_api_key = isinstance(api_keys, list) and any(
              isinstance(k, dict) and bool(k.get("current_key")) for k in api_keys
          )
          if not app_id or not has_api_key:
              print("::error::google-services.json client entry is missing mobilesdk_app_id or api_key.")
              sys.exit(1)

          oauth_clients = matched_client.get("oauth_client")
          has_web_oauth = isinstance(oauth_clients, list) and any(
              isinstance(o, dict) and o.get("client_type") == 3 for o in oauth_clients
          )
          has_android_oauth = isinstance(oauth_clients, list) and any(
              isinstance(o, dict) and o.get("client_type") == 1 for o in oauth_clients
          )

          print("Validated android/app/google-services.json for package com.aistudents.app.")
          print(f"OAuth clients present - web (client_type=3): {has_web_oauth}, android SHA (client_type=1): {has_android_oauth}")
          PY
          then
            rm -f "$TARGET_FILE"
            exit 1
          fi

          echo "firebase_configured=true" >> "$GITHUB_OUTPUT"

      - name: 9. Capacitor sync Android
        run: npx cap sync android

      - name: 10. Gradle assembleDebug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Verify APK & Firebase Plugin Packaging
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

          if unzip -p "$APK_PATH" assets/capacitor.plugins.json | grep -q "FirebaseAuthenticationPlugin"; then
            echo "Verified: FirebaseAuthenticationPlugin is registered in assets/capacitor.plugins.json."
          else
            echo "::error::FirebaseAuthenticationPlugin missing from assets/capacitor.plugins.json"
            exit 1
          fi

      - name: 12. Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-students-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="ai-students-debug-v1.0.0-build.${{ github.run_number }}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --title "AI Students Android Debug APK (Build #${{ github.run_number }})" \
              --notes "Automated Debug APK build for AI Students (com.aistudents.app). Commit: ${{ github.sha }}" \
              --latest
          fi
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${RELEASE_APK}"
          echo "Direct APK Download URL: $DOWNLOAD_URL"
          {
            echo "## AI Students Android APK Ready"
            echo "- **Artifact**: \`ai-students-debug-apk\`"
            echo "- **APK Size**: $(du -h "$APK_PATH" | cut -f1)"
            echo "- **Firebase Android google-services.json configured**: \`${{ steps.firebase_config.outputs.firebase_configured }}\`"
            echo "- **Direct Release Download**: $DOWNLOAD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
