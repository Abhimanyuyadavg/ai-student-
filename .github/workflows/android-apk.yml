name: Build AI Students Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 3. Setup Java compatible version (Java 21)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure Android SDK 36 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 5. Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 6. TypeScript check
        run: npx tsc --noEmit

      - name: 7. Build Vite project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ais-pre-sep3an4tmru2vymxhi6lyy-318163649696.asia-northeast1.run.app' }}
        run: npm run build

      - name: Configure Android google-services.json (if secret provided)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Configured android/app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Configured android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -f android/app/google-services.json ]; then
            echo "Using repository android/app/google-services.json."
          else
            echo "::warning::android/app/google-services.json not found. Native FirebaseAuthentication plugin requires google-services.json to initialize FirebaseApp and Google Sign-In on Android."
          fi

          if [ -f android/app/google-services.json ]; then
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
              const clients = Array.isArray(cfg.client) ? cfg.client : [];
              const androidClient = clients.find(c => c?.client_info?.android_client_info?.package_name === "com.aistudents.app");
              if (!androidClient) {
                console.error("ERROR: google-services.json does not contain an Android client for package com.aistudents.app");
                process.exit(1);
              }
              const oauthClients = Array.isArray(androidClient.oauth_client) ? androidClient.oauth_client : [];
              const hasWebClient = oauthClients.some(o => o.client_type === 3);
              const hasAndroidOauth = oauthClients.some(o => o.client_type === 1);
              console.log("Verified google-services.json for com.aistudents.app (Web OAuth client_type=3:", hasWebClient, ", Android SHA OAuth client_type=1:", hasAndroidOauth, ")");
              if (!hasWebClient) {
                console.warn("::warning::google-services.json is missing OAuth client_type 3 (default_web_client_id). Enable Google Sign-In in Firebase Console and re-download google-services.json.");
              }
              if (!hasAndroidOauth) {
                console.warn("::warning::google-services.json is missing OAuth client_type 1 (Android SHA-1). Add your Debug/Release SHA-1 & SHA-256 in Firebase Console and re-download google-services.json.");
              }
            '
          fi

      - name: 8. Capacitor sync Android
        run: npx cap sync android

      - name: 9. Gradle assembleDebug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Verify APK & Firebase Plugin Packaging
        id: verify_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

          if unzip -p "$APK_PATH" assets/capacitor.plugins.json | grep -q "FirebaseAuthenticationPlugin"; then
            echo "Verified: FirebaseAuthenticationPlugin is registered in assets/capacitor.plugins.json."
          else
            echo "ERROR: FirebaseAuthenticationPlugin missing from assets/capacitor.plugins.json"
            exit 1
          fi

          if [ -f android/app/google-services.json ]; then
            echo "firebase_android_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "firebase_android_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK built WITHOUT android/app/google-services.json. Native Google Sign-In & Phone OTP will report FirebaseAuthentication uninitialized until google-services.json is configured."
          fi

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-students-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="ai-students-debug-v1.0.0-build.${{ github.run_number }}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --title "AI Students Android Debug APK (Build #${{ github.run_number }})" \
              --notes "Automated Debug APK build for AI Students (com.aistudents.app). Commit: ${{ github.sha }}" \
              --latest
          fi
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${RELEASE_APK}"
          echo "Direct APK Download URL: $DOWNLOAD_URL"
          {
            echo "## AI Students Android APK Ready"
            echo "- **Artifact**: \`ai-students-debug-apk\`"
            echo "- **APK Size**: $(du -h "$APK_PATH" | cut -f1)"
            echo "- **Firebase Android google-services.json bundled**: \`${{ steps.verify_apk.outputs.firebase_android_configured }}\`"
            echo "- **Direct Release Download**: $DOWNLOAD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
